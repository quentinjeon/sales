<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월별 수익률 대시보드</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#eef0f4; --line:#e2e5ea;
  --text:#111827; --text-2:#4b5563; --text-3:#9ca3af;
  --pos:#0f9d58; --warn:#e8a33d; --neg:#dc3545; --accent:#3b5bdb;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e242e; --line:#2a3039;
  --text:#e8eaed; --text-2:#9aa3af; --text-3:#6b7280;
  --pos:#37c07b; --warn:#f0b555; --neg:#f2666f; --accent:#7d93f7;
}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e242e; --line:#2a3039;
  --text:#e8eaed; --text-2:#9aa3af; --text-3:#6b7280;
  --pos:#37c07b; --warn:#f0b555; --neg:#f2666f; --accent:#7d93f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
  "Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;
  flex-wrap:wrap;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:13px;margin-top:4px}
.tagm{display:inline-block;background:var(--surface-2);color:var(--text-2);
  border-radius:999px;padding:3px 10px;font-size:11.5px;border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:24px;font-weight:680;letter-spacing:-.02em;margin-top:6px}
.kpi .d{font-size:11.5px;color:var(--text-3);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px;margin-bottom:16px}
.card h2{margin:0 0 2px;font-size:15px;letter-spacing:-.01em}
.card .cap{color:var(--text-2);font-size:12.5px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tfoot td{border-top:2px solid var(--line);border-bottom:none;font-weight:680;padding-top:11px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.bar{position:relative;height:6px;background:var(--surface-2);border-radius:3px;
  min-width:70px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;display:block}
.alert{background:color-mix(in srgb,var(--neg) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--neg) 34%,var(--line))}
.trend{display:flex;gap:10px;align-items:flex-end;height:130px;padding-top:8px}
.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:5px}
.trend .b{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.trend .p{width:100%;background:var(--pos);border-radius:0 0 4px 4px;min-height:2px;opacity:.75}
.trend .lb{font-size:10.5px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.foot{color:var(--text-3);font-size:11.5px;margin-top:26px;line-height:1.7}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-2);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:-1px}
.legend .r::before{background:var(--accent)}.legend .g::before{background:var(--pos)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;

const won = n => (n===null||n===undefined) ? "—" : Math.round(n).toLocaleString("ko-KR");
const pct = (n,d=2) => (n===null||n===undefined) ? "—" : (n*100).toFixed(d)+"%";
const cls = m => m===null||m===undefined ? "" : (m<0 ? "neg" : m<0.05 ? "warn" : "pos");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function mbar(m){
  if(m===null||m===undefined) return "—";
  const c = m<0 ? "var(--neg)" : m<0.05 ? "var(--warn)" : "var(--pos)";
  const w = Math.min(Math.abs(m)/0.35,1)*100;
  return `<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
    <div class="bar"><i style="width:${w.toFixed(0)}%;background:${c}"></i></div>
    <b style="color:${c};min-width:58px;text-align:right">${pct(m)}</b></div>`;
}

const t = D.totals, q = D.quality;
const share = k => t.revenue ? (t[k]/t.revenue*100).toFixed(1)+"%" : "—";

let h = `
<header>
  <div>
    <h1>월별 수익률 대시보드</h1>
    <div class="sub">${D.period} · 활성 채널 ${D.channels.length}곳 · 주문 ${won(t.orders)}건</div>
  </div>
  <span class="tagm">목업 데이터 · 실존 기업과 무관</span>
</header>

<div class="kpis">
  <div class="kpi"><div class="l">총매출</div><div class="v">${won(t.revenue)}<span style="font-size:14px;font-weight:400"> 원</span></div>
    <div class="d">판매수량 ${won(t.qty)}개</div></div>
  <div class="kpi"><div class="l">기여이익</div><div class="v ${cls(t.margin)}">${won(t.profit)}<span style="font-size:14px;font-weight:400"> 원</span></div>
    <div class="d">주문당 ${won(t.profit/t.orders)}원</div></div>
  <div class="kpi"><div class="l">마진율</div><div class="v ${cls(t.margin)}">${pct(t.margin)}</div>
    <div class="d">수수료 ${share("fee")} · 원가 ${share("cogs")} · 물류 ${share("logistics")}</div></div>
  <div class="kpi"><div class="l">미매핑</div><div class="v ${q.unmapped_count?"warn":""}">${won(q.unmapped_count)}<span style="font-size:14px;font-weight:400"> 건</span></div>
    <div class="d">${won(q.unmapped_amount)}원 · 매핑률 ${pct(q.mapping_rate,1)}</div></div>
</div>`;

if(D.losses.length){
  const ls = D.losses.reduce((a,r)=>a+r.profit,0);
  h += `<div class="card alert">
    <h2 class="neg">적자 딜 ${D.losses.length}건 — 이번 달 손실 ${won(-ls)}원</h2>
    <div class="cap">팔수록 손해입니다. 가격을 올리거나, 수수료가 낮은 채널로 옮기거나, 구성을 바꿔야 합니다.</div>
    <div class="scroll"><table>
      <thead><tr><th>채널</th><th>제품(딜)</th><th class="n">판매가</th><th class="n">주문</th>
        <th class="n">매출</th><th class="n">기여이익</th><th class="n">마진율</th></tr></thead>
      <tbody>${D.losses.map(r=>`<tr><td>${esc(r.channel)}</td><td>${esc(r.name)}</td>
        <td class="n">${won(r.price)}</td><td class="n">${won(r.orders)}</td>
        <td class="n">${won(r.revenue)}</td><td class="n neg">${won(r.profit)}</td>
        <td class="n">${mbar(r.margin)}</td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

h += `<div class="card">
  <h2>채널별 손익</h2>
  <div class="cap">매출 순. 같은 제품을 팔아도 수수료율이 다르면 남는 돈이 달라집니다.</div>
  <div class="scroll"><table>
    <thead><tr><th>채널</th><th class="n">수수료율</th><th class="n">주문</th><th class="n">매출</th>
      <th class="n">수수료</th><th class="n">원가</th><th class="n">물류비</th>
      <th class="n">기여이익</th><th class="n">마진율</th></tr></thead>
    <tbody>${D.channels.map(c=>`<tr><td><b>${esc(c.name)}</b></td>
      <td class="n">${pct(c.rate,1)}</td><td class="n">${won(c.orders)}</td>
      <td class="n">${won(c.revenue)}</td><td class="n">${won(c.fee)}</td>
      <td class="n">${won(c.cogs)}</td><td class="n">${won(c.logistics)}</td>
      <td class="n"><b>${won(c.profit)}</b></td><td class="n">${mbar(c.margin)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>합계</td><td class="n">${pct(t.fee/t.revenue,1)}</td>
      <td class="n">${won(t.orders)}</td><td class="n">${won(t.revenue)}</td>
      <td class="n">${won(t.fee)}</td><td class="n">${won(t.cogs)}</td>
      <td class="n">${won(t.logistics)}</td><td class="n">${won(t.profit)}</td>
      <td class="n">${pct(t.margin)}</td></tr></tfoot>
  </table></div></div>

<div class="grid2">
  <div class="card">
    <h2>제품별 기여이익</h2>
    <div class="cap">이익 순 상위 12개. 매출 1위와 이익 1위는 대개 다릅니다.</div>
    <div class="scroll"><table style="min-width:0">
      <thead><tr><th>제품</th><th class="n">수량</th><th class="n">매출</th>
        <th class="n">기여이익</th><th class="n">마진율</th></tr></thead>
      <tbody>${D.products.slice(0,12).map(p=>`<tr><td>${esc(p.name)}</td>
        <td class="n">${won(p.qty)}</td><td class="n">${won(p.revenue)}</td>
        <td class="n ${cls(p.margin)}">${won(p.profit)}</td>
        <td class="n ${cls(p.margin)}">${pct(p.margin)}</td></tr>`).join("")}</tbody>
    </table></div></div>

  <div class="card">
    <h2>주별 추이</h2>
    <div class="cap">막대 위=매출, 아래=기여이익. 특가 비중이 오르는 주에 마진율이 눌립니다.</div>
    <div class="trend">${(()=>{ const mx=Math.max(...D.weeks.map(w=>w.revenue),1),
      pm=Math.max(...D.weeks.map(w=>Math.abs(w.profit)),1);
      return D.weeks.map(w=>`<div>
        <div class="b" style="height:${(w.revenue/mx*74).toFixed(0)}px"></div>
        <div class="p" style="height:${(Math.abs(w.profit)/pm*30).toFixed(0)}px"></div>
        <div class="lb">${esc(w.week.slice(5))}</div>
        <div class="lb ${cls(w.margin)}">${pct(w.margin,1)}</div></div>`).join(""); })()}</div>
    <div class="legend"><span class="r">매출</span><span class="g">기여이익</span></div>
  </div>
</div>

<div class="foot">
  기여이익 = 순매출 − 채널 수수료 − 원가 − 물류비 &nbsp;·&nbsp; 마진율 = 기여이익 ÷ 순매출<br>
  이 페이지는 <code>docs/lecture/실습데이터_생성.py</code> 가 만든 정답지입니다.
  회사·제품·채널·금액은 전부 가상이며 실존 기업과 무관합니다.
</div>`;

document.getElementById("app").innerHTML = h;
</script>
</body>
</html>
